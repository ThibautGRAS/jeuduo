<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deux jeux — Thibaut &amp; PF</title>
<meta name="theme-color" content="#05070E">
<!-- La racine ne sert plus un jeu mais le CHOIX entre les deux. Avant, elle
     servait DUO, ce qui faisait croire que le dépôt était DUO et que
     Callaghan en était un sous-produit. -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;background:#05070E;color:#EDE7FA;
       font-family:system-ui,-apple-system,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:28px;padding:32px 20px}
  h1{margin:0;font-size:clamp(15px,4vw,20px);font-weight:700;letter-spacing:.34em;
     color:#8E86A8;text-indent:.34em;text-align:center}
  .jeux{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;width:100%;max-width:760px}
  a.jeu{flex:1 1 300px;max-width:360px;text-decoration:none;color:inherit;
        border:1px solid rgba(180,160,230,.22);border-radius:20px;overflow:hidden;
        background:rgba(255,255,255,.03);display:block;transition:border-color .2s}
  a.jeu:active{border-color:rgba(247,179,43,.6)}
  a.jeu img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
  .txt{padding:16px 18px 20px}
  .txt b{display:block;font-size:clamp(19px,5vw,24px);font-weight:800;margin-bottom:6px}
  .txt i{display:block;font-style:normal;font-size:14px;color:#9C93B6;line-height:1.45}
  footer{font-size:12px;color:#5D5675;text-align:center}
</style>
</head>
<body>
  <h1>DEUX JEUX</h1>
  <div class="jeux">
    <a class="jeu" href="callaghan/">
      <img src="callaghan/icone-512.png" alt="">
      <span class="txt"><b>Les Enquêtes de Callaghan</b>
      <i>Quatre niveaux au D'Tour : la file, l'enquête, la tournée et la ruelle.</i></span>
    </a>
    <a class="jeu" href="duo/">
      <img src="duo/icone-512.png" alt="">
      <span class="txt"><b>DUO</b>
      <i>Duel de raquettes en pair-à-pair, à deux ou contre l'ordinateur.</i></span>
    </a>
  </div>
  <footer>thibautgras.github.io/jeuduo</footer>
</body>
</html>
