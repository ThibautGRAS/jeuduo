<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060C">
<title>DUO — duel néon temps réel</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#04060C;
  --verre:rgba(13,19,33,.55);
  --bord:rgba(120,160,255,.14);
  --texte:#EAF0FF;
  --sourd:#7C8AA5;
  --moi:#22D3EE;      /* cyan — toujours le joueur local */
  --adv:#F471B5;      /* magenta — toujours l'adversaire */
  --or:#FBBF24;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--fond);
  color:var(--texte);
  font-family:"Space Grotesk",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}

/* ================= AURORE DE FOND ================= */
.aurore{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.aurore span{
  position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;
  animation:derive 26s ease-in-out infinite alternate;
}
.aurore span:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:#0E7490}
.aurore span:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;bottom:-25vmax;background:#701A4B;animation-delay:-8s}
.aurore span:nth-child(3){width:35vmax;height:35vmax;left:30vw;top:55vh;background:#1E2A6E;animation-delay:-16s}
@keyframes derive{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(6vmax,-5vmax) scale(1.15)}
}
@media (prefers-reduced-motion: reduce){
  .aurore span{animation:none}
}

/* ================= LOBBY ================= */
#lobby{
  position:relative;z-index:1;
  display:flex;flex-direction:column;gap:20px;align-items:center;
  padding:28px;max-width:420px;width:100%;
}
#lobby h1{
  font-size:64px;font-weight:700;letter-spacing:.3em;margin-left:.3em;
  background:linear-gradient(120deg,var(--moi),#8AB4FF 55%,var(--adv));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(34,211,238,.35));
}
#lobby p.sous{color:var(--sourd);font-size:13.5px;text-align:center;line-height:1.7;font-weight:400}
.carte{
  width:100%;padding:20px;border-radius:16px;
  background:var(--verre);border:1px solid var(--bord);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);
  display:flex;flex-direction:column;gap:14px;
}
.carte h2{
  font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:400;
  letter-spacing:.28em;color:var(--sourd);
}
button{
  font-family:inherit;font-size:15.5px;font-weight:500;letter-spacing:.04em;
  color:var(--fond);background:linear-gradient(120deg,var(--moi),#67E8F9);
  border:none;border-radius:12px;padding:14px 16px;width:100%;cursor:pointer;
  box-shadow:0 6px 24px rgba(34,211,238,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
button:active{transform:scale(.97);box-shadow:0 3px 12px rgba(34,211,238,.3)}
button:focus-visible{outline:2px solid var(--texte);outline-offset:3px}
button:disabled{opacity:.35;pointer-events:none}
button.secondaire{
  color:var(--texte);background:transparent;
  border:1px solid rgba(244,113,181,.55);box-shadow:none;
}
input{
  font-family:"JetBrains Mono",monospace;font-size:24px;letter-spacing:.42em;
  text-align:center;text-transform:uppercase;
  background:rgba(5,8,16,.6);border:1px solid var(--bord);border-radius:12px;
  color:var(--texte);padding:13px;width:100%;transition:border-color .2s;
}
input:focus{outline:none;border-color:var(--moi)}
#codePartie{
  font-family:"JetBrains Mono",monospace;font-size:38px;font-weight:700;
  letter-spacing:.42em;margin-left:.42em;text-align:center;color:var(--moi);
  text-shadow:0 0 18px rgba(34,211,238,.55);
  user-select:all;-webkit-user-select:all;
  animation:apparition .5s ease both;
}
@keyframes apparition{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#etatLobby{font-size:12.5px;color:var(--sourd);text-align:center;min-height:18px;font-family:"JetBrains Mono",monospace}
.pulse::after{content:"";display:inline-block;width:6px;height:6px;margin-left:8px;border-radius:50%;
  background:var(--moi);vertical-align:middle;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.cache{display:none !important}

/* ================= JEU ================= */
#jeu{
  position:relative;z-index:1;display:none;
  flex-direction:column;align-items:center;gap:10px;
  width:100%;height:100%;justify-content:center;
}
#hud{
  display:flex;justify-content:space-between;align-items:baseline;
  width:min(92vw,540px);
  font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--sourd);
}
#score{font-size:30px;font-weight:700;letter-spacing:.15em;color:var(--texte)}
#score .s1{color:var(--moi);text-shadow:0 0 14px rgba(34,211,238,.5)}
#score .s2{color:var(--adv);text-shadow:0 0 14px rgba(244,113,181,.5)}
#score .pop{display:inline-block;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(1.9)}to{transform:scale(1)}}
#ping{min-width:72px;text-align:right}
#scene{position:relative;width:min(92vw,540px)}
canvas{
  display:block;width:100%;border-radius:18px;
  border:1px solid var(--bord);
  background:radial-gradient(ellipse at 50% 50%, #070B16 0%, #04060C 75%);
  box-shadow:0 24px 70px rgba(0,0,0,.6), inset 0 0 90px rgba(20,35,80,.25);
  touch-action:none;
}
#voile{
  position:absolute;inset:0;border-radius:18px;
  display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
  background:rgba(4,6,12,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#voile.cache{display:none}
#voile .grand{
  font-size:64px;font-weight:700;
  background:linear-gradient(120deg,var(--moi),var(--adv));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .4s cubic-bezier(.2,1.6,.4,1) both;
}
#voile .petit{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--sourd);letter-spacing:.15em}
#voile button{width:auto;padding:13px 34px}
#msgJeu{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--sourd);min-height:16px;letter-spacing:.1em}
</style>
</head>
<body>

<div class="aurore" aria-hidden="true"><span></span><span></span><span></span></div>

<div id="lobby">
  <h1>DUO</h1>
  <p class="sous">Duel néon en temps réel, pair-à-pair.<br>Vos deux navigateurs se parlent directement — premier à 7.</p>

  <div class="carte">
    <h2>CRÉER UNE PARTIE</h2>
    <button id="btnCreer">Générer un code</button>
    <div id="codePartie" class="cache"></div>
  </div>

  <div class="carte">
    <h2>REJOINDRE</h2>
    <input id="champCode" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
    <button id="btnRejoindre" class="secondaire">Rejoindre la partie</button>
  </div>

  <div id="etatLobby"></div>
</div>

<div id="jeu">
  <div id="hud">
    <div id="role"></div>
    <div id="score"><span class="s1">0</span> · <span class="s2">0</span></div>
    <div id="ping">— ms</div>
  </div>
  <div id="scene">
    <canvas id="cv" width="540" height="720"></canvas>
    <div id="voile" class="cache">
      <div class="grand" id="voileTitre"></div>
      <div class="petit" id="voileSous"></div>
      <button id="btnRevanche" class="cache">Revanche</button>
    </div>
  </div>
  <div id="msgJeu">GLISSEZ POUR DÉPLACER VOTRE RAQUETTE</div>
</div>

<script>
"use strict";

/* ================= CONFIG ================= */
const LARG = 540, HAUT = 720;
const RAQ_L = 110, RAQ_H = 12, RAQ_MARGE = 34;
const BALLE_R = 8;
const VIT_INIT = 5.2, VIT_MAX = 13, ACCEL = 1.045;
const SCORE_GAGNANT = 7;
const TICK_ENVOI = 33;
const DUREE_COMPTE = 1500;         // ms avant chaque service
const PREFIXE = "duo-pong-tg-";

const CO_MOI = "#22D3EE", CO_ADV = "#F471B5", CO_BALLE = "#EAF0FF";

/* ================= ÉTAT ================= */
let peer = null, conn = null;
let estHote = false, partieEnCours = false;
let dernierPingEnvoi = 0;

/* phase : "compte" | "jeu" | "fin" (pilotée par l'hôte, répliquée chez l'invité) */
let phase = "compte", finCompte = 0;

const etat = {
  balle: { x: LARG/2, y: HAUT/2, vx: 0, vy: 0 },
  raqBas: LARG/2, raqHaut: LARG/2,
  score: [0, 0],
};
let maRaquette = LARG/2;
let raqAdvAffichee = LARG/2;       // position lissée de la raquette adverse

/* Invité : cible reçue + extrapolation locale */
const cible = { x: LARG/2, y: HAUT/2, vx: 0, vy: 0, t: 0 };

/* ================= EFFETS ================= */
const traine = [];                 // positions passées de la balle
const particules = [];
let secousse = 0;                  // intensité de tremblement d'écran
let flashBut = 0;                  // éclat plein écran après un but

function explosion(x, y, couleur, n, force){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const v = (0.5 + Math.random()) * force;
    particules.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v, vie: 1, couleur });
  }
}

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const lobby = $("lobby"), jeu = $("jeu");
const etatLobby = $("etatLobby"), codePartie = $("codePartie");
const cv = $("cv"), ctx = cv.getContext("2d");
const elScore = $("score"), elPing = $("ping"), elRole = $("role");
const voile = $("voile"), voileTitre = $("voileTitre"), voileSous = $("voileSous");
const btnRevanche = $("btnRevanche");

/* ================= LOBBY ================= */
function genCode(){
  const c = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random()*c.length)];
  return s;
}

$("btnCreer").addEventListener("click", () => {
  const code = genCode();
  estHote = true;
  $("btnCreer").disabled = true;
  etatLobby.textContent = "Création de la partie…";
  peer = new Peer(PREFIXE + code);
  peer.on("open", () => {
    codePartie.textContent = code;
    codePartie.classList.remove("cache");
    etatLobby.textContent = "Partagez ce code — en attente du joueur 2";
    etatLobby.classList.add("pulse");
  });
  peer.on("connection", c => {
    conn = c;
    conn.on("open", demarrerPartie);
    brancherConnexion();
  });
  peer.on("error", erreurLobby);
});

$("btnRejoindre").addEventListener("click", () => {
  const code = $("champCode").value.trim().toUpperCase();
  if (code.length !== 4){ etatLobby.textContent = "Code à 4 caractères requis."; return; }
  estHote = false;
  $("btnRejoindre").disabled = true;
  etatLobby.textContent = "Connexion…";
  peer = new Peer();
  peer.on("open", () => {
    conn = peer.connect(PREFIXE + code, { reliable: false });
    conn.on("open", demarrerPartie);
    brancherConnexion();
    setTimeout(() => {
      if (!partieEnCours){
        etatLobby.textContent = "Partie introuvable. Vérifiez le code.";
        $("btnRejoindre").disabled = false;
      }
    }, 8000);
  });
  peer.on("error", erreurLobby);
});

function erreurLobby(e){
  etatLobby.classList.remove("pulse");
  etatLobby.textContent = "Erreur : " + (e.type === "unavailable-id" ? "code déjà pris, réessayez" : e.type);
  $("btnCreer").disabled = false;
  $("btnRejoindre").disabled = false;
}

/* ================= CONNEXION ================= */
function brancherConnexion(){
  conn.on("data", recevoir);
  conn.on("close", () => {
    partieEnCours = false;
    montrerVoile("—", "ADVERSAIRE DÉCONNECTÉ · RECHARGEZ POUR REJOUER", false);
  });
}

function demarrerPartie(){
  partieEnCours = true;
  lobby.style.display = "none";
  jeu.style.display = "flex";
  elRole.textContent = estHote ? "HÔTE" : "INVITÉ";
  if (estHote){
    preparerService(Math.random() < 0.5 ? 1 : -1);
    setInterval(envoyerEtatHote, TICK_ENVOI);
  } else {
    setInterval(envoyerRaquetteInvite, TICK_ENVOI);
  }
  setInterval(envoyerPing, 2000);
  requestAnimationFrame(boucle);
}

/* ================= PROTOCOLE =================
   h : état complet + phase        (hôte -> invité)
   r : raquette invité             (invité -> hôte)
   fx: événement visuel {k,x,y}    (hôte -> invité)
   rm: demande de revanche
   p / q : ping / pong                            */
function envoyerEtatHote(){
  if (!conn || !conn.open) return;
  etat.raqBas = maRaquette;
  conn.send({ t:"h",
    b:[etat.balle.x, etat.balle.y, etat.balle.vx, etat.balle.vy],
    r: etat.raqBas, s: etat.score, ph: phase });
}
function envoyerRaquetteInvite(){
  if (!conn || !conn.open) return;
  conn.send({ t:"r", r: maRaquette });
}
function envoyerFx(k, x, y){
  if (conn && conn.open) conn.send({ t:"fx", k, x, y });
}
function envoyerPing(){
  if (!conn || !conn.open) return;
  dernierPingEnvoi = performance.now();
  conn.send({ t:"p" });
}

function recevoir(m){
  if (!m || typeof m !== "object") return;
  switch (m.t){
    case "h": {
      cible.x = m.b[0]; cible.y = m.b[1]; cible.vx = m.b[2]; cible.vy = m.b[3];
      cible.t = performance.now();
      etat.raqBas = m.r;
      const scoreChange = m.s[0] !== etat.score[0] || m.s[1] !== etat.score[1];
      etat.score = m.s;
      if (scoreChange) majScore(true);
      if (m.ph !== phase){
        phase = m.ph;
        if (phase === "fin") afficherFin();
        else voile.classList.add("cache");
      }
      break;
    }
    case "r": etat.raqHaut = m.r; break;
    case "fx": jouerFx(m.k, m.x, m.y); break;
    case "rm": if (estHote) lancerRevanche(); break;
    case "p": conn.send({ t:"q" }); break;
    case "q": elPing.textContent = Math.round(performance.now() - dernierPingEnvoi) + " ms"; break;
  }
}

function jouerFx(k, x, y){
  if (k === "raq"){ explosion(x, y, CO_BALLE, 14, 3.2); secousse = Math.max(secousse, 3); }
  if (k === "mur"){ explosion(x, y, "#8AB4FF", 8, 2.2); }
  if (k === "but"){ explosion(x, y, CO_BALLE, 40, 5); secousse = 9; flashBut = 1; }
}

/* ================= PHYSIQUE (hôte) ================= */
function preparerService(sens){
  phase = "compte";
  finCompte = performance.now() + DUREE_COMPTE;
  etat.balle.x = LARG/2; etat.balle.y = HAUT/2;
  etat.balle.vx = 0; etat.balle.vy = 0;
  etat.balle._sens = sens;
}
function servir(){
  const angle = (Math.random()*0.6 - 0.3);
  etat.balle.vx = VIT_INIT * Math.sin(angle);
  etat.balle.vy = VIT_INIT * Math.cos(angle) * etat.balle._sens;
  phase = "jeu";
}

function physique(){
  if (phase === "compte"){
    if (performance.now() >= finCompte) servir();
    return;
  }
  if (phase !== "jeu") return;
  const b = etat.balle;
  b.x += b.vx; b.y += b.vy;

  if (b.x < BALLE_R){ b.x = BALLE_R; b.vx = Math.abs(b.vx); fxLocal("mur", b.x, b.y); }
  if (b.x > LARG - BALLE_R){ b.x = LARG - BALLE_R; b.vx = -Math.abs(b.vx); fxLocal("mur", b.x, b.y); }

  const yBas = HAUT - RAQ_MARGE - RAQ_H;
  if (b.vy > 0 && b.y + BALLE_R >= yBas && b.y + BALLE_R <= yBas + RAQ_H + 12){
    if (Math.abs(b.x - etat.raqBas) < RAQ_L/2 + BALLE_R){
      rebond(etat.raqBas, -1); b.y = yBas - BALLE_R; fxLocal("raq", b.x, b.y);
    }
  }
  const yHaut = RAQ_MARGE + RAQ_H;
  if (b.vy < 0 && b.y - BALLE_R <= yHaut && b.y - BALLE_R >= yHaut - RAQ_H - 12){
    if (Math.abs(b.x - etat.raqHaut) < RAQ_L/2 + BALLE_R){
      rebond(etat.raqHaut, 1); b.y = yHaut + BALLE_R; fxLocal("raq", b.x, b.y);
    }
  }
  if (b.y > HAUT + 30) marquer(1, -1);
  if (b.y < -30) marquer(0, 1);
}

function fxLocal(k, x, y){ jouerFx(k, x, y); envoyerFx(k, x, y); }

function marquer(qui, sensSuivant){
  etat.score[qui]++;
  majScore(true);
  fxLocal("but", etat.balle.x, Math.max(20, Math.min(HAUT-20, etat.balle.y)));
  if (etat.score[qui] >= SCORE_GAGNANT){
    phase = "fin";
    afficherFin();
  } else {
    preparerService(sensSuivant);
  }
}

function rebond(xRaq, sensY){
  const b = etat.balle;
  const decal = (b.x - xRaq) / (RAQ_L/2);
  const vit = Math.min(Math.hypot(b.vx, b.vy) * ACCEL, VIT_MAX);
  const angle = decal * 1.05;
  b.vx = vit * Math.sin(angle);
  b.vy = vit * Math.cos(angle) * sensY;
}

/* ================= FIN & REVANCHE ================= */
function montrerVoile(titre, sous, avecBouton){
  voileTitre.textContent = titre;
  voileSous.textContent = sous;
  btnRevanche.classList.toggle("cache", !avecBouton);
  voile.classList.remove("cache");
}
function afficherFin(){
  const jAiGagne = estHote ? etat.score[0] >= SCORE_GAGNANT : etat.score[1] >= SCORE_GAGNANT;
  montrerVoile(jAiGagne ? "VICTOIRE" : "DÉFAITE",
    etat.score[0] + " — " + etat.score[1] + (estHote ? "" : " (HÔTE — VOUS)"), true);
  voileTitre.style.filter = jAiGagne
    ? "drop-shadow(0 0 26px rgba(251,191,36,.6))"
    : "drop-shadow(0 0 20px rgba(124,138,165,.4))";
}
btnRevanche.addEventListener("click", () => {
  if (estHote) lancerRevanche();
  else if (conn && conn.open) conn.send({ t:"rm" });
  btnRevanche.disabled = true;
  setTimeout(() => btnRevanche.disabled = false, 1200);
});
function lancerRevanche(){
  etat.score = [0, 0];
  majScore(false);
  voile.classList.add("cache");
  preparerService(Math.random() < 0.5 ? 1 : -1);
}

/* ================= ENTRÉES ================= */
function posDepuisEvenement(clientX){
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width * LARG;
  maRaquette = Math.max(RAQ_L/2, Math.min(LARG - RAQ_L/2, x));
}
cv.addEventListener("touchstart", e => { e.preventDefault(); posDepuisEvenement(e.touches[0].clientX); }, {passive:false});
cv.addEventListener("touchmove",  e => { e.preventDefault(); posDepuisEvenement(e.touches[0].clientX); }, {passive:false});
cv.addEventListener("mousemove",  e => posDepuisEvenement(e.clientX));

/* ================= RENDU ================= */
function majScore(pop){
  const [sH, sI] = etat.score;
  const g = estHote ? sH : sI, d = estHote ? sI : sH;
  const cls = pop ? ' class="pop"' : "";
  elScore.innerHTML = '<span class="s1"><span' + cls + '>' + g + '</span></span> · ' +
                      '<span class="s2"><span' + cls + '>' + d + '</span></span>';
}

function boucle(){
  if (estHote){
    physique();
  } else {
    /* extrapolation : on avance la balle depuis la dernière cible reçue */
    if (phase === "jeu"){
      const dt = (performance.now() - cible.t) / (1000/60);
      etat.balle.x += (cible.x + cible.vx*dt - etat.balle.x) * 0.5;
      etat.balle.y += (cible.y + cible.vy*dt - etat.balle.y) * 0.5;
    } else {
      etat.balle.x = cible.x; etat.balle.y = cible.y;
    }
  }
  /* lissage raquette adverse */
  const xAdvCible = estHote ? etat.raqHaut : etat.raqBas;
  raqAdvAffichee += (xAdvCible - raqAdvAffichee) * 0.4;

  dessiner();
  if (partieEnCours) requestAnimationFrame(boucle);
}

function dessiner(){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, LARG, HAUT);

  /* secousse d'écran */
  if (secousse > 0.2){
    ctx.translate((Math.random()-0.5)*secousse, (Math.random()-0.5)*secousse);
    secousse *= 0.86;
  }

  const flip = !estHote;
  const Y = y => flip ? HAUT - y : y;

  /* ligne médiane */
  ctx.strokeStyle = "rgba(120,160,255,.14)";
  ctx.lineWidth = 1;
  ctx.setLineDash([6, 12]);
  ctx.beginPath(); ctx.moveTo(0, HAUT/2); ctx.lineTo(LARG, HAUT/2); ctx.stroke();
  ctx.setLineDash([]);

  /* compte à rebours */
  if (phase === "compte" && estHote === true){
    dessinerCompte(Math.max(0, finCompte - performance.now()));
  } else if (phase === "compte"){
    dessinerCompte(null);
  }

  /* traînée de balle */
  if (phase === "jeu"){
    traine.push({ x: etat.balle.x, y: etat.balle.y });
    if (traine.length > 16) traine.shift();
  } else traine.length = 0;
  for (let i = 0; i < traine.length; i++){
    const a = (i+1) / traine.length;
    ctx.fillStyle = "rgba(138,180,255," + (a*0.22).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(traine[i].x, Y(traine[i].y), BALLE_R * a, 0, Math.PI*2);
    ctx.fill();
  }

  /* particules */
  for (let i = particules.length - 1; i >= 0; i--){
    const p = particules[i];
    p.x += p.vx; p.y += p.vy; p.vx *= 0.94; p.vy *= 0.94; p.vie -= 0.03;
    if (p.vie <= 0){ particules.splice(i, 1); continue; }
    ctx.globalAlpha = p.vie;
    ctx.fillStyle = p.couleur;
    ctx.fillRect(p.x - 1.5, Y(p.y) - 1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  /* raquettes — lueur néon */
  ctx.shadowBlur = 22;
  ctx.shadowColor = CO_MOI;
  ctx.fillStyle = CO_MOI;
  arrondi(maRaquette - RAQ_L/2, HAUT - RAQ_MARGE - RAQ_H, RAQ_L, RAQ_H, 6);
  ctx.shadowColor = CO_ADV;
  ctx.fillStyle = CO_ADV;
  arrondi(raqAdvAffichee - RAQ_L/2, RAQ_MARGE, RAQ_L, RAQ_H, 6);

  /* balle */
  if (phase === "jeu"){
    ctx.shadowBlur = 26;
    ctx.shadowColor = CO_BALLE;
    ctx.fillStyle = CO_BALLE;
    ctx.beginPath();
    ctx.arc(etat.balle.x, Y(etat.balle.y), BALLE_R, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  /* flash de but */
  if (flashBut > 0.02){
    ctx.fillStyle = "rgba(234,240,255," + (flashBut*0.18).toFixed(3) + ")";
    ctx.fillRect(-10, -10, LARG+20, HAUT+20);
    flashBut *= 0.88;
  }
}

function dessinerCompte(restant){
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "700 88px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "rgba(234,240,255,.85)";
  ctx.shadowBlur = 30; ctx.shadowColor = CO_MOI;
  const texte = restant === null ? "•" : String(Math.ceil(restant/500));
  ctx.fillText(texte, LARG/2, HAUT/2);
  ctx.shadowBlur = 0;
}

function arrondi(x, y, l, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + l, y, x + l, y + h, r);
  ctx.arcTo(x + l, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + l, y, r);
  ctx.fill();
}
</script>
